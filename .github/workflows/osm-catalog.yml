name: Refresh BOR venue catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'
  push:
    paths:
      - 'scripts/build_osm_catalog.py'
      - '.github/workflows/osm-catalog.yml'
permissions:
  contents: write
concurrency:
  group: bor-osm-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM parser
        run: python -m pip install 'osmium>=4.0,<5'
      - name: Fetch Uzbekistan OSM extract and build cached catalog
        run: python scripts/build_osm_catalog.py
      - name: Publish updated venue cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/osm-tashkent.json
          if git diff --cached --quiet; then echo 'Unchanged'; else git commit -m 'data: refresh cached Tashkent venues' && git push; fi
